<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Chi Tiêu Cá Nhân</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(16px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .toast-animation { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-28 selection:bg-indigo-500 selection:text-white">

    <!-- Header Tươi tắn, Sáng sủa -->
    <header class="bg-white/85 backdrop-blur-md border-b border-slate-200/80 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-base shadow-sm">👛</div>
                <h1 id="headerTitle" class="text-base font-bold text-slate-800 tracking-tight">Thêm Giao Dịch</h1>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="exportData()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-200 transition active:scale-95">Sao lưu</button>
                <label class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-200 cursor-pointer transition active:scale-95">
                    Phục hồi <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                </label>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Notification / Alert Container -->
        <div id="alertContainer" class="space-y-2"></div>
        
        <!-- Toast Container được tinh chỉnh vị trí và giao diện đẹp mắt hơn -->
        <div id="toastContainer" class="fixed bottom-24 left-4 right-4 max-w-sm mx-auto z-50 pointer-events-none"></div>

        <!-- ================= TAB 1: ADD TRANSACTION ================= -->
        <div id="tabContentAdd" class="space-y-4">
            
            <div class="bg-white border border-slate-200/80 p-5 rounded-3xl shadow-xl shadow-slate-200/50 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Tạo khoản giao dịch mới</h2>
                    <span class="text-xs text-indigo-600 font-bold bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100">Yên Nhật (¥)</span>
                </div>
                
                <form id="txForm" onsubmit="addTransaction(event)" class="space-y-4">
                    <!-- Segmented Control tươi tắn -->
                    <div class="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200/60">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="type" value="expense" checked class="peer hidden" onchange="handleTypeChange()">
                            <div class="text-center py-2.5 text-xs font-bold rounded-xl text-slate-500 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:shadow-md transition-all duration-200">🔻 Chi Tiêu</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="type" value="income" class="peer hidden" onchange="handleTypeChange()">
                            <div class="text-center py-2.5 text-xs font-bold rounded-xl text-slate-500 peer-checked:bg-emerald-500 peer-checked:text-white peer-checked:shadow-md transition-all duration-200">🟢 Thu Nhập</div>
                        </label>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[11px] font-bold text-slate-500 block mb-1.5">Số tiền (¥)</label>
                            <input type="text" inputmode="numeric" id="amount" required placeholder="0" oninput="formatCurrencyInput(this)" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-sm text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-500 block mb-1.5">Ngày giao dịch</label>
                            <input type="date" id="date" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-sm text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[11px] font-bold text-slate-500 block mb-1.5">Danh mục</label>
                            <input type="text" id="category" list="categoryList" required placeholder="Chọn hoặc nhập..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-sm text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition">
                            <datalist id="categoryList"></datalist>
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-500 block mb-1.5">Cửa hàng / Nguồn</label>
                            <input type="text" id="store" placeholder="VD: 7-Eleven" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-sm text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-slate-500 block mb-1.5">Ghi chú (Tùy chọn)</label>
                        <input type="text" id="memo" placeholder="Nhập ghi chú thêm..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-sm text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition">
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3.5 rounded-2xl text-sm shadow-lg shadow-indigo-500/25 transition active:scale-[0.98]">Lưu Giao Dịch & Nhập Tiếp</button>
                </form>
            </div>
        </div>

        <!-- ================= TAB 2: HISTORY & DASHBOARD ================= -->
        <div id="tabContentHistory" class="space-y-4 hidden">
            
            <!-- Month Filter Card -->
            <div class="bg-white border border-slate-200/80 p-3.5 rounded-2xl shadow-sm flex items-center justify-between">
                <span class="text-xs font-bold text-slate-500">Tháng thống kê:</span>
                <input type="month" id="filterMonth" onchange="renderApp()" class="bg-slate-50 border border-slate-200 text-xs text-slate-800 rounded-xl px-3 py-1.5 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Dashboard Summary Cards -->
            <div class="grid grid-cols-3 gap-2.5">
                <div class="bg-gradient-to-br from-emerald-50 to-teal-50/50 border border-emerald-200/70 p-3 rounded-2xl shadow-sm">
                    <p class="text-[10px] text-emerald-600 font-bold tracking-wider uppercase">Tổng Thu</p>
                    <p id="totalIncome" class="text-xs sm:text-sm font-extrabold text-emerald-700 mt-1 truncate">0 ¥</p>
                </div>
                <div class="bg-gradient-to-br from-rose-50 to-pink-50/50 border border-rose-200/70 p-3 rounded-2xl shadow-sm">
                    <p class="text-[10px] text-rose-600 font-bold tracking-wider uppercase">Tổng Chi</p>
                    <p id="totalExpense" class="text-xs sm:text-sm font-extrabold text-rose-700 mt-1 truncate">0 ¥</p>
                </div>
                <div id="balanceCard" class="bg-gradient-to-br from-blue-50 to-indigo-50/50 border border-blue-200/70 p-3 rounded-2xl shadow-sm">
                    <p class="text-[10px] text-blue-600 font-bold tracking-wider uppercase">Số Dư</p>
                    <p id="totalBalance" class="text-xs sm:text-sm font-extrabold text-blue-700 mt-1 truncate">0 ¥</p>
                </div>
            </div>

            <!-- Transaction History Container -->
            <div class="bg-white border border-slate-200/80 p-4 rounded-3xl shadow-xl shadow-slate-200/50 space-y-3.5">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">📜 Lịch Sử Giao Dịch</h2>
                </div>

                <!-- History Sub-Tabs Filter -->
                <div class="flex bg-slate-100 p-1 rounded-2xl border border-slate-200 text-xs font-semibold">
                    <button onclick="switchHistoryTab('all')" id="subTabAll" class="flex-1 py-2 rounded-xl transition bg-white text-indigo-600 shadow-sm font-bold">Tất cả</button>
                    <button onclick="switchHistoryTab('expense')" id="subTabExpense" class="flex-1 py-2 rounded-xl transition text-slate-500 font-medium">Chi tiêu</button>
                    <button onclick="switchHistoryTab('income')" id="subTabIncome" class="flex-1 py-2 rounded-xl transition text-slate-500 font-medium">Thu nhập</button>
                </div>

                <!-- Transaction Items List -->
                <div id="txList" class="space-y-2.5 max-h-[420px] overflow-y-auto pr-1 no-scrollbar"></div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-3 left-4 right-4 bg-white/90 backdrop-blur-xl border border-slate-200 shadow-xl rounded-3xl z-50 max-w-sm mx-auto">
        <div class="flex justify-around p-1.5">
            <button onclick="switchMainTab('add')" id="navBtnAdd" class="flex flex-col items-center flex-1 py-2 text-indigo-600 font-bold transition rounded-2xl bg-indigo-50 border border-indigo-100">
                <span class="text-base">➕</span>
                <span class="text-[10px] mt-0.5 tracking-wide">Nhập Giao Dịch</span>
            </button>
            <button onclick="switchMainTab('history')" id="navBtnHistory" class="flex flex-col items-center flex-1 py-2 text-slate-400 font-semibold transition rounded-2xl hover:text-slate-600">
                <span class="text-base">📊</span>
                <span class="text-[10px] mt-0.5 tracking-wide">Lịch Sử & Số Dư</span>
            </button>
        </div>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        // ================= MESSAGE DICTIONARY =================
        const Messages = {
            SUCCESS_SAVE: "Đã lưu giao dịch thành công!",
            ERROR_INVALID_AMOUNT: "Vui lòng nhập số tiền hợp lệ lớn hơn 0.",
            CONFIRM_DELETE: "Bạn có chắc chắn muốn xóa giao dịch này không?",
            EMPTY_MONTH: "Không có giao dịch nào trong tháng này.",
            FINANCIAL_WARNING: "Tổng chi tiêu tháng này đang vượt quá thu nhập.",
            BTN_VIEW_HISTORY: "Xem lịch sử",
            EXPORT_FAILED: "Xuất file thất bại.",
            IMPORT_SUCCESS: "Khôi phục dữ liệu thành công!",
            IMPORT_INVALID_FILE: "File không hợp lệ hoặc định dạng sai.",
            IMPORT_READ_ERROR: "Không đọc được file."
        };

        const StorageService = {
            TX_KEY: 'my_wallet_transactions_v8',
            BACKUP_KEY: 'my_wallet_last_backup_v8',

            getTransactions() {
                try {
                    const data = localStorage.getItem(this.TX_KEY);
                    return data ? JSON.parse(data) : [];
                } catch (e) { return []; }
            },
            saveTransactions(txs) {
                try { localStorage.setItem(this.TX_KEY, JSON.stringify(txs)); } catch (e) {}
            }
        };

        let currentMainTab = 'add';
        let currentHistoryTab = 'all';

        const categories = {
            expense: ["Ăn uống / Nhà hàng", "Đi lại / Tàu xe", "Siêu thị / Cửa hàng tiện lợi", "Điện nước / Internet", "Mua sắm cá nhân", "Giải trí / Sức khỏe"],
            income: ["Lương chính", "Thưởng / Làm thêm", "Thu nhập khác"]
        };

        const categoryIcons = {
            "Ăn uống / Nhà hàng": "🍜",
            "Đi lại / Tàu xe": "🚃",
            "Siêu thị / Cửa hàng tiện lợi": "🛒",
            "Điện nước / Internet": "⚡",
            "Mua sắm cá nhân": "🛍️",
            "Giải trí / Sức khỏe": "💊",
            "Lương chính": "💰",
            "Thưởng / Làm thêm": "🎁",
            "Thu nhập khác": "📥"
        };

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
            document.getElementById('filterMonth').value = today.substring(0, 7);
            updateCategorySuggestions();
            renderApp();
        });

        function formatCurrencyInput(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value) {
                value = Number(value).toLocaleString('en-US');
            }
            input.value = value;
        }

        function switchMainTab(tab) {
            currentMainTab = tab;
            const tabAdd = document.getElementById('tabContentAdd');
            const tabHistory = document.getElementById('tabContentHistory');
            const navBtnAdd = document.getElementById('navBtnAdd');
            const navBtnHistory = document.getElementById('navBtnHistory');
            const headerTitle = document.getElementById('headerTitle');

            if (tab === 'add') {
                tabAdd.classList.remove('hidden');
                tabHistory.classList.add('hidden');
                navBtnAdd.className = "flex flex-col items-center flex-1 py-2 text-indigo-600 font-bold transition rounded-2xl bg-indigo-50 border border-indigo-100";
                navBtnHistory.className = "flex flex-col items-center flex-1 py-2 text-slate-400 font-semibold transition rounded-2xl hover:text-slate-600";
                headerTitle.innerText = "Thêm Giao Dịch";
            } else {
                tabAdd.classList.add('hidden');
                tabHistory.classList.remove('hidden');
                navBtnAdd.className = "flex flex-col items-center flex-1 py-2 text-slate-400 font-semibold transition rounded-2xl hover:text-slate-600";
                navBtnHistory.className = "flex flex-col items-center flex-1 py-2 text-indigo-600 font-bold transition rounded-2xl bg-indigo-50 border border-indigo-100";
                headerTitle.innerText = "Lịch Sử & Thống Kê";
                renderApp();
            }
        }

        function switchHistoryTab(tab) {
            currentHistoryTab = tab;
            ['all', 'expense', 'income'].forEach(t => {
                const btn = document.getElementById(`subTab${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (t === tab) {
                    btn.className = "flex-1 py-2 rounded-xl transition bg-white text-indigo-600 shadow-sm font-bold";
                } else {
                    btn.className = "flex-1 py-2 rounded-xl transition text-slate-500 font-medium";
                }
            });
            renderApp();
        }

        function updateCategorySuggestions() {
            const type = document.querySelector('input[name="type"]:checked').value;
            const datalist = document.getElementById('categoryList');
            datalist.innerHTML = '';
            categories[type].forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                datalist.appendChild(option);
            });
        }

        function handleTypeChange() {
            updateCategorySuggestions();
            document.getElementById('category').value = '';
        }

        // Thiết kế Toast mới gọn gàng, tinh tế và sang trọng hơn
        function showToast(messageKey) {
            const container = document.getElementById('toastContainer');
            const messageText = Messages[messageKey] || messageKey;

            container.innerHTML = `
                <div class="bg-slate-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-2xl flex items-center justify-between gap-3 toast-animation pointer-events-auto border border-slate-700/50">
                    <div class="flex items-center gap-2.5">
                        <span class="flex items-center justify-center w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 text-xs shrink-0 font-bold">✓</span>
                        <span class="font-semibold tracking-wide">${messageText}</span>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="switchMainTab('history'); clearToast();" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] px-3 py-1.5 rounded-xl font-bold transition active:scale-95 shadow-md shadow-indigo-600/30">${Messages.BTN_VIEW_HISTORY}</button>
                        <button onclick="clearToast()" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition font-bold text-sm" title="Đóng">✕</button>
                    </div>
                </div>
            `;
        }

        function clearToast() {
            document.getElementById('toastContainer').innerHTML = '';
        }

        function addTransaction(e) {
            e.preventDefault();
            const typeInput = document.querySelector('input[name="type"]:checked');
            const amountInput = document.getElementById('amount');
            const dateInput = document.getElementById('date');
            const categoryInput = document.getElementById('category');
            const storeInput = document.getElementById('store');
            const memoInput = document.getElementById('memo');

            const rawAmount = amountInput.value.replace(/,/g, '');
            const amount = parseFloat(rawAmount);

            if (isNaN(amount) || amount <= 0) {
                alert(Messages.ERROR_INVALID_AMOUNT);
                amountInput.focus();
                return;
            }

            const newTx = {
                id: 'tx_' + Date.now() + Math.random().toString(36).substring(2, 9),
                type: typeInput.value,
                amount: amount,
                date: dateInput.value.trim(),
                category: categoryInput.value.trim(),
                store: storeInput.value ? storeInput.value.trim() : '',
                memo: memoInput.value ? memoInput.value.trim() : ''
            };

            const txs = StorageService.getTransactions();
            txs.unshift(newTx);
            StorageService.saveTransactions(txs);

            amountInput.value = '';
            storeInput.value = '';
            memoInput.value = '';
            amountInput.focus();

            showToast('SUCCESS_SAVE');
            renderApp();
        }

        function deleteTransaction(id) {
            if (confirm(Messages.CONFIRM_DELETE)) {
                let txs = StorageService.getTransactions();
                txs = txs.filter(tx => tx.id !== id);
                StorageService.saveTransactions(txs);
                renderApp();
            }
        }

        function renderApp() {
            const filterMonth = document.getElementById('filterMonth').value;
            const txs = StorageService.getTransactions();
            const monthTxs = txs.filter(tx => tx.date && tx.date.startsWith(filterMonth));

            let totalIncome = 0;
            let totalExpense = 0;
            monthTxs.forEach(tx => {
                if (tx.type === 'income') totalIncome += tx.amount;
                else totalExpense += tx.amount;
            });

            let displayedTxs = monthTxs;
            if (currentHistoryTab === 'expense') displayedTxs = monthTxs.filter(tx => tx.type === 'expense');
            else if (currentHistoryTab === 'income') displayedTxs = monthTxs.filter(tx => tx.type === 'income');

            let listHTML = '';
            if (displayedTxs.length === 0) {
                listHTML = `<p class="text-center text-xs text-slate-400 py-8">${Messages.EMPTY_MONTH}</p>`;
            } else {
                displayedTxs.forEach(tx => {
                    const isIncome = tx.type === 'income';
                    const amountFormatted = Number(tx.amount).toLocaleString('en-US') + ' ¥';
                    const icon = categoryIcons[tx.category] || (isIncome ? '💰' : '📦');
                    
                    listHTML += `
                        <div class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-50 border border-slate-200/60 hover:bg-slate-100/80 transition">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-2xl ${isIncome ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-slate-200 text-slate-700 border border-slate-300'} flex items-center justify-center text-base shrink-0 shadow-sm">
                                    ${icon}
                                </div>
                                <div class="space-y-0.5">
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs font-bold text-slate-800">${escapeHtml(tx.category)}</span>
                                    </div>
                                    <div class="text-[11px] text-slate-500 flex gap-2">
                                        <span>📅 ${tx.date}</span>
                                        ${tx.store ? `<span>🏪 ${escapeHtml(tx.store)}</span>` : ''}
                                    </div>
                                    ${tx.memo ? `<p class="text-[11px] text-slate-400 italic">💬 ${escapeHtml(tx.memo)}</p>` : ''}
                                </div>
                            </div>
                            <div class="text-right flex items-center gap-3">
                                <div>
                                    <span class="text-xs sm:text-sm font-bold ${isIncome ? 'text-emerald-600' : 'text-slate-800'} block">
                                        ${isIncome ? '+' : '-'}${amountFormatted}
                                    </span>
                                </div>
                                <button onclick="deleteTransaction('${tx.id}')" class="w-7 h-7 rounded-xl bg-slate-200/80 hover:bg-rose-100 hover:text-rose-600 text-slate-400 flex items-center justify-center text-xs font-bold transition" title="Xóa">×</button>
                            </div>
                        </div>
                    `;
                });
            }

            const balance = totalIncome - totalExpense;
            document.getElementById('totalIncome').innerText = totalIncome.toLocaleString('en-US') + ' ¥';
            document.getElementById('totalExpense').innerText = totalExpense.toLocaleString('en-US') + ' ¥';
            
            const balanceEl = document.getElementById('totalBalance');
            const balanceCard = document.getElementById('balanceCard');
            balanceEl.innerText = balance.toLocaleString('en-US') + ' ¥';

            if (balance < 0) {
                balanceCard.className = "bg-gradient-to-br from-rose-50 to-pink-50/50 border border-rose-200/70 p-3 rounded-2xl shadow-sm";
                balanceEl.className = "text-xs sm:text-sm font-extrabold text-rose-600 mt-1 truncate";
            } else {
                balanceCard.className = "bg-gradient-to-br from-blue-50 to-indigo-50/50 border border-blue-200/70 p-3 rounded-2xl shadow-sm";
                balanceEl.className = "text-xs sm:text-sm font-extrabold text-blue-700 mt-1 truncate";
            }

            document.getElementById('txList').innerHTML = listHTML;
            renderAlerts(balance);
        }

        function renderAlerts(balance) {
            const container = document.getElementById('alertContainer');
            let html = '';
            if (balance < 0) {
                html += `
                    <div class="bg-rose-50 border border-rose-200 text-rose-700 p-3.5 rounded-2xl flex items-center gap-3 shadow-sm">
                        <span class="text-xl">⚠️</span>
                        <div class="text-xs">
                            <span class="font-bold block mb-0.5">Cảnh báo tài chính</span>
                            ${Messages.FINANCIAL_WARNING}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function exportData() {
            try {
                const data = StorageService.getTransactions();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href, a.href = url;
                a.download = `expense-tracker-${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) { alert(Messages.EXPORT_FAILED); }
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (Array.isArray(data)) {
                        StorageService.saveTransactions(data);
                        renderApp();
                        alert(Messages.IMPORT_SUCCESS);
                    } else { alert(Messages.IMPORT_INVALID_FILE); }
                } catch (err) { alert(Messages.IMPORT_READ_ERROR); }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
